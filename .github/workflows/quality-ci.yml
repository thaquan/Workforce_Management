name: Quality Gates (Synthetic CI)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-and-synthetic-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hr_etl
          POSTGRES_PASSWORD: synthetic_ci_only_password
          POSTGRES_DB: workforce_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hr_etl -d workforce_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: "127.0.0.1"
      POSTGRES_PORT: "5433"
      POSTGRES_DB: workforce_ci
      POSTGRES_USER: hr_etl
      POSTGRES_PASSWORD: synthetic_ci_only_password
      HR_SYNTHETIC_DB: "YES"
      HR_PHASE4_ISOLATED_TESTS: "YES"
    steps:
      - name: Checkout tracked code only (no real employee data)
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dbt.txt
            requirements-dagster.txt
      - name: Install pinned tools
        run: |
          python -m pip install -r requirements.txt -r requirements-dbt.txt -r requirements-dagster.txt
          dbt --version
      - name: Static source, contract and safety checks
        run: |
          python -m unittest discover -s tests -p 'test_phase2_idempotency.py' -v
          python -m unittest discover -s tests -p 'test_phase2_ingest.py' -v
          python -m unittest discover -s tests -p 'test_phase3_modeling.py' -v
          python -m unittest discover -s tests -p 'test_phase4_quality.py' -v
      - name: Phase 5 semantic model and six-page report checks (offline)
        run: python -m unittest discover -s tests -p 'test_phase5_*.py' -v
      - name: Phase 7 Dagster graph and safety checks (offline)
        run: python -m unittest discover -s tests -p 'test_phase7_*.py' -v
      - name: Create isolated synthetic source tables
        run: python -m src.phase4.synthetic_fixture
      - name: Build dbt models and generic tests (exclude real workbook baselines)
        run: dbt build --project-dir dbt_hr --profiles-dir dbt_hr --exclude tag:full_baseline
      - name: Persist and enforce Phase 4 quality gates
        run: python -m src.phase4.pipeline --quality-only
      - name: Isolated corruption and recovery regression
        run: python -m unittest discover -s tests -p 'test_phase4_recovery.py' -v
      - name: Phase 7 Dagster on the disposable synthetic PostgreSQL database
        run: python -m src.phase7.run --mode synthetic --allow-disposable-reset
      - name: Generate dbt lineage docs
        run: dbt docs generate --project-dir dbt_hr --profiles-dir dbt_hr